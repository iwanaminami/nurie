services:
  nurie:
    build: .
    image: nurie-scheduler
    ports:
      - "127.0.0.1:8378:8378"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  # Cloudflare Tunnel で公開する場合だけ使う（--profile tunnel）
  cloudflared:
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba # 2026.10.7
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nurie
    restart: unless-stopped
    profiles:
      - tunnel
