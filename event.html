  body[data-theme="light"] td.cell.maybe{background:#fbd9dd;color:#a50d26}

  body[data-theme="light"] .bar{border-color:#e2e8f0}
  body[data-theme="light"] .fadeR{background:linear-gradient(to right,rgba(246,248,252,0),rgba(200,16,46,.18))}
  body[data-theme="light"] .fadeL{background:linear-gradient(to left,rgba(246,248,252,0),rgba(200,16,46,.18))}
  body[data-theme="light"] .seg button.on{color:#fff}
  body[data-theme="light"] .seg button.on.tri{color:#a50d26}

  body[data-theme="light"] th,body[data-theme="light"] td{border-color:#e3e3e3}
  body[data-theme="light"] table.listTable th,body[data-theme="light"] table.listTable td{border-color:#e3e3e3}

  body[data-theme="light"] .wrap{border-color:#ddd}

  body[data-theme="light"] table.listTable td.sym.hourL{border-left-color:#d9b3ba}
  body[data-theme="light"] td.cell{background:#fff}
  body[data-theme="light"] td.cell.off{background:#f1f2f4}
  body[data-theme="light"] th.day{background:#f7f7f7}
  body[data-theme="light"] #grid th.corner{background:#f7f7f7}
  /* 横スクロールバーは枠の下側の帯に出し、色をテーマに合わせる */
  .scrollOuter{border:1px solid #ddd;border-radius:10px;background:#fff;overflow:hidden}
  .wrap{border:none;border-radius:0}
  .listOuter{border:1px solid #ddd;border-radius:10px;background:#fff;overflow:hidden}
  .listWrap{border:none;border-radius:0;background:transparent}
  .fadeR,.fadeL{bottom:16px}
  .listFade{bottom:16px}
  .wrap,.listWrap{padding-bottom:16px}
  .wrap,.listWrap{scrollbar-width:thin;scrollbar-color:#dfa7b0 transparent}
  .wrap::-webkit-scrollbar,.listWrap::-webkit-scrollbar{height:8px}
  .wrap::-webkit-scrollbar-track,.listWrap::-webkit-scrollbar-track{background:transparent}

  .wrap::-webkit-scrollbar-thumb:hover,.listWrap::-webkit-scrollbar-thumb:hover{background:#c8102e}
  @media (prefers-color-scheme: dark){
    .scrollOuter,.listOuter{border-color:#333a48;background:#15181e}
    .wrap,.listWrap{scrollbar-color:#7a4a55 transparent}
    .wrap::-webkit-scrollbar-thumb,.listWrap::-webkit-scrollbar-thumb{background:#7a4a55}
  }
  body[data-theme="dark"] .scrollOuter,body[data-theme="dark"] .listOuter{border-color:#333a48;background:#15181e}
  body[data-theme="dark"] .wrap,body[data-theme="dark"] .listWrap{scrollbar-color:#7a4a55 transparent}
  body[data-theme="dark"] .wrap::-webkit-scrollbar-thumb,body[data-theme="dark"] .listWrap::-webkit-scrollbar-thumb{background:#7a4a55}
  body[data-theme="light"] .scrollOuter,body[data-theme="light"] .listOuter{border-color:#ddd;background:#fff}
  body[data-theme="light"] .wrap,body[data-theme="light"] .listWrap{scrollbar-color:#dfa7b0 transparent}
  body[data-theme="light"] .wrap::-webkit-scrollbar-thumb,body[data-theme="light"] .listWrap::-webkit-scrollbar-thumb{background:#dfa7b0}
  #themeBtn{position:fixed;top:10px;right:12px;z-index:60;width:38px;height:38px;border-radius:50%;padding:0;font-size:17px;line-height:1;box-shadow:0 2px 8px rgba(30,41,59,.18)}
</style>
</head>
<body>
<div id="adminBanner" style="display:none;background:#1e293b;color:#fff;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.08em;padding:6px 0;margin:-14px -14px 12px">🔑 管理者モード</div>
<button id="themeBtn" title="ダークモード切替">🌙</button>
<style>.logoD{display:none}@media (prefers-color-scheme:dark){.logoL{display:none!important}.logoD{display:inline!important}}body[data-theme="dark"] .logoL{display:none!important}body[data-theme="dark"] .logoD{display:inline!important}body[data-theme="light"] .logoL{display:inline!important}body[data-theme="light"] .logoD{display:none!important}</style><div style="text-align:center;margin:0 0 10px"><a href="/" style="text-decoration:none;display:inline-block"><img class="logoL" src="/logo.png" alt="nurie" style="height:30px;vertical-align:middle"><img class="logoD" src="/logo-dark.png" alt="nurie" style="height:30px;vertical-align:middle;display:none"></a></div>
<h1 id="title">読み込み中…</h1>
<div id="editView" style="display:none">
<div class="bar" style="margin-bottom:8px;align-items:center">
  <span style="font-weight:700;font-size:14px;white-space:nowrap">参加者（あなたの名前）</span>
  <label style="flex:1"><input id="name" value="" placeholder="名前" style="width:100%"></label>
</div>
<div class="bar" style="margin-bottom:8px;align-items:center">
  <span style="font-weight:700;font-size:14px;white-space:nowrap">一言（任意）</span>
  <label style="flex:1"><input id="note" value="" placeholder="例：13時以降なら確実です" maxlength="200" style="width:100%"></label>
</div>
<div class="bar">
  <div class="group"><div class="seg">
      <button id="modeO" class="on"><svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>空いてる</button>
      <button id="modeTri"><svg class="ic" viewBox="0 0 20 20"><path d="M10 3.2 L17.8 16.8 H2.2 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>空いてなくはない</button>
      <button id="modeX"><svg class="ic" viewBox="0 0 20 20"><path d="M4.6 4.6 L15.4 15.4 M15.4 4.6 L4.6 15.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>空いてない</button>
    </div>
  </div>
  <div class="group"><div class="seg">
      <button id="paintBtn" class="on">✏️ 塗る</button>
      <button id="scrollBtn">✋ スクロール</button>
    </div>
  </div>
  <div class="group" style="flex-basis:100%;align-items:center"><button id="clearBtn">自分の塗りをクリア</button></div>
</div>
<div class="scrollOuter" id="paintView"><div class="wrap" id="wrap"><table id="grid"></table></div><div class="fadeL" id="fadeL"></div><div class="fadeR" id="fadeR"></div></div>
<div id="dateView" style="display:none"></div>
</div><!-- /editView -->
<div class="plist" id="plist"></div>
<div id="listView"></div>
<div id="editFoot" style="display:none;flex-direction:column;gap:10px;align-items:center;margin:16px 0 26px">
  <button id="saveBtn" style="background:#c8102e;color:#fff;border-color:#c8102e;font-weight:bold;padding:0 26px">保存する</button>
  <button id="backBtn">一覧に戻る</button>
  <button id="deleteMineBtn" class="danger" style="display:none">この回答を削除する</button>
  <button id="dotBtn" style="display:none">🎨 ドット絵で画像出力</button>
  <span id="saveState"></span>
</div>
<div id="listFoot" style="display:flex;flex-direction:column;gap:10px;align-items:center;margin:16px 0 26px">
  <button id="answerBtn" style="background:#c8102e;color:#fff;border-color:#c8102e;font-weight:bold;padding:0 26px">回答する</button>
  <button id="shareBtn">この調整表を共有する</button>
  <span id="shareMsg" style="font-size:12.5px;color:#16a34a"></span>
  <button id="copyAdminBtn" style="display:none">管理ページのURLをコピー</button>
  <span id="adminMsg" style="font-size:12.5px;color:#16a34a"></span>
  <button id="csvBtn" style="display:none">回答をCSVでダウンロード</button>
  <div id="expiresInfo" style="display:none;font-size:12.5px;color:#64748b;text-align:center"></div>
  <button id="delBtn" style="display:none;margin-top:8px">この調整表を削除する</button>
</div>
<script>
const SLOT=30;
let slots=[]; for(let m=0;m<24*60;m+=SLOT) slots.push(m); // イベントの時間帯で読み込み時に作り直す
let editingName=null; // 編集中の元の名前（改名判定用）
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const SVG_O='<svg class="ic cell-ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>';
const SVG_T='<svg class="ic cell-ic" viewBox="0 0 20 20"><path d="M10 3.2 L17.8 16.8 H2.2 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>';
const SVG_X='<svg class="ic cell-ic" viewBox="0 0 20 20"><path d="M4.6 4.6 L15.4 15.4 M15.4 4.6 L4.6 15.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';
const eventId=location.pathname.split('/').pop();
const params=new URLSearchParams(location.search);
const adminKey=params.get('admin');
let isAdmin=false;
let evKind='time';
let days=[], others=new Map(), notes=new Map(), mine=new Map(), allowedSet=null, effAllowed=null, view='list'; // mine: "YYYY-MM-DD|slot" -> 1 | 0.5 | -1
let mode=1, painting=null, dragging=false, scrollMode=false;
const grid=document.getElementById('grid');
const nameEl=document.getElementById('name'), noteEl=document.getElementById('note'), saveEl=document.getElementById('saveState');
const dayLabel=ds=>{const d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）';};
const keyOf=(ds,si)=>ds+'|'+si;

function scrollToEarliest(){
  const ths=grid.querySelectorAll('th.time');
  let idx=0;
  if(effAllowed && effAllowed.size){ idx=Math.min(...[...effAllowed].map(k=>+k.split('|')[1])); }
  const wrapEl=document.getElementById('wrap');
  const target=Math.max(0, idx-1);
  if(target>0 && ths[target]) wrapEl.scrollLeft=Math.max(0, ths[target].offsetLeft-66);
  else wrapEl.scrollLeft=0;
  updateFades();
}
async function load(){
  const r=await fetch('/api/events/'+eventId);
  if(!r.ok){ document.getElementById('title').textContent='調整表が見つかりません'; return; }
  const j=await r.json();
  document.getElementById('title').textContent=j.title;
  document.title=j.title+' | nurie';
  const ogt=document.querySelector('meta[property="og:title"]'); if(ogt) ogt.setAttribute('content', j.title+' | nurie');
  const twt=document.querySelector('meta[name="twitter:title"]'); if(twt) twt.setAttribute('content', j.title+' | nurie');
  days=j.dates;
  evKind=j.kind||'time';
  slots=[]; for(let m=0;m<24*60;m+=SLOT) slots.push(m); // 表示は常に 0:00-24:00
  allowedSet=j.allowed? new Set(j.allowed) : null;
  if(allowedSet) effAllowed=allowedSet;
  else if((j.startMin??0)>0 || (j.endMin??1440)<1440){
    effAllowed=new Set();
    days.forEach(ds=>{ for(let m=(j.startMin??0);m<(j.endMin??1440);m+=SLOT) effAllowed.add(ds+'|'+(m/SLOT)); });
  } else effAllowed=null;
  others=new Map(j.participants.map(p=>[p.name,p.marks]));
  notes=new Map(j.participants.map(p=>[p.name,p.note||'']));
  if(j.expiresAt) window._expiresAt=j.expiresAt;
  const saved=localStorage.getItem('nurie-name')||localStorage.getItem('tonton-name');
  if(saved && others.has(saved)){ nameEl.value=saved; adopt(saved); }
  else if(saved){ nameEl.value=saved; }
  renderPlist();
  buildGrid(); render();
  requestAnimationFrame(()=>requestAnimationFrame(scrollToEarliest));
  if(adminKey){
    try{
      const vr=await fetch('/api/events/'+eventId+'/verify-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey})});
      const vj=await vr.json();
      if(vj.ok){ isAdmin=true; document.getElementById('adminBanner').style.display=''; document.getElementById('delBtn').style.display=''; document.getElementById('copyAdminBtn').style.display=''; document.getElementById('csvBtn').style.display='';
        if(window._expiresAt){ const ei=document.getElementById('expiresInfo'); ei.textContent='保存期限：'+window._expiresAt+' に自動削除されます'; ei.style.display=''; ei.style.marginTop='26px'; } }
    }catch(e){}
  }
  setView('list');
}
function renderPlist(){
  const el=document.getElementById('plist');
  el.innerHTML='';
  const names=[...others.keys()];
  if(!names.length){ el.textContent='参加者：まだいません'; return; }
  const label=document.createElement('span'); label.textContent='参加者：'; el.appendChild(label);
  names.forEach(n=>{
    const b=document.createElement('button');
    b.textContent=n;
    b.style.cssText='height:26px;padding:0 10px;margin:0 3px;border-radius:999px;font-size:12.5px';
    b.addEventListener('click',()=>startEdit(n));
    el.appendChild(b);
  });
}
function adopt(name){
  mine=new Map(Object.entries(others.get(name)||{}));
  noteEl.value=notes.get(name)||'';
}
nameEl.addEventListener('change',()=>{
  const n=nameEl.value.trim();
  localStorage.setItem('nurie-name',n);
  if(mine.size===0 && others.has(n)) adopt(n); // 塗りが空のときだけ保存済みを読み込む（入力前の塗りを消さない）
  render();
});
function markDirty(){ saveEl.textContent='未保存の変更があります'; saveEl.style.color='#d97706'; }
async function save(){
  const n=nameEl.value.trim();
  if(!n){ saveEl.textContent='先に名前を入れてください'; saveEl.style.color='#dc2626'; return; }
  if(others.has(n) && n!==editingName){ saveEl.textContent='その名前は既に使われています。編集する場合は一覧でその名前を押してください'; saveEl.style.color='#dc2626'; return; }
  saveEl.textContent='保存中…'; saveEl.style.color='#94a3b8';
  const marks={}; mine.forEach((v,k)=>{ marks[k]=v; });
  const payload={name:n,marks,note:noteEl.value.trim().slice(0,200)}; if(editingName && editingName!==n) payload.prevName=editingName;
  const r=await fetch('/api/events/'+eventId+'/paint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.ok){
    saveEl.textContent='保存しました'; saveEl.style.color='#16a34a';
    if(editingName && editingName!==n){ others.delete(editingName); notes.delete(editingName); localStorage.setItem('nurie-name',n); }
    others.set(n,marks); notes.set(n,payload.note);
    renderPlist();
    setView('list');
  } else { saveEl.textContent='保存に失敗しました'; saveEl.style.color='#dc2626'; }
}
document.getElementById('saveBtn').addEventListener('click',save);
function paintCell(td){
  const key=keyOf(td.dataset.ds,+td.dataset.s);
  if(effAllowed && !effAllowed.has(key)) return;
  if(painting===null) painting=(mine.get(key)===mode)?'del':'set';
  const before=mine.get(key);
  if(painting==='set') mine.set(key,mode); else mine.delete(key);
  if(mine.get(key)!==before){ renderCell(td); updateCount(); markDirty(); }
}
function renderCell(td){
  const key=keyOf(td.dataset.ds,+td.dataset.s);
  let cls='cell', html='';
  if(effAllowed && !effAllowed.has(key)){ cls+=' off';
    if(td.dataset.st!==cls+'|') { td.dataset.st=cls+'|'; td.className=cls; td.innerHTML=''; }
    return; }
  const v=mine.get(key);
  if(v===1){ cls+=' mine'; html=SVG_O; }
  else if(v===0.5){ cls+=' maybe'; html=SVG_T; }
  else if(v===-1){ cls+=' ng'; html=SVG_X; }
  else { cls+=' def'; html=SVG_X; }
  if((+td.dataset.s*SLOT)%60===0) cls+=' hourL';
  if(td.dataset.st===cls+'|'+html) return;
  td.dataset.st=cls+'|'+html;
  td.className=cls; td.innerHTML=html;
}
function updateCount(){}
function render(){ grid.querySelectorAll('td.cell').forEach(renderCell); updateCount(); if(evKind==='date') renderDateCals(); }
function buildGrid(){
  grid.innerHTML='';
  const hr=document.createElement('tr');
  const corner=document.createElement('th'); corner.className='corner'; hr.appendChild(corner);
  slots.forEach((m,idx)=>{ const th=document.createElement('th'); th.className='time';
    if(m%60===0){ const sp=document.createElement('span'); sp.className='tick'; sp.textContent=fmt(m); th.appendChild(sp); }
    if(idx===slots.length-1 && (m+SLOT)%60===0 && m+SLOT<24*60){
      const sp2=document.createElement('span'); sp2.className='tick';
      sp2.style.left='100%'; sp2.textContent=fmt(m+SLOT); th.appendChild(sp2);
    }
    hr.appendChild(th); });
  grid.appendChild(hr);
  days.forEach(ds=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th'); th.className='day'; th.textContent=dayLabel(ds); tr.appendChild(th);
    slots.forEach((m,si)=>{
      const td=document.createElement('td'); td.className='cell'; td.dataset.ds=ds; td.dataset.s=m/SLOT;
      td.addEventListener('pointerdown',e=>{ if(scrollMode) return; e.preventDefault(); dragging=true; painting=null; paintCell(td); });
      tr.appendChild(td);
    });
    grid.appendChild(tr);
  });
}
let moveQueued=false, lastX=0, lastY=0, prevX=null, prevY=null;
document.addEventListener('pointerdown',e=>{ prevX=e.clientX; prevY=e.clientY; });
document.addEventListener('pointermove',e=>{
  if(!dragging) return;
  lastX=e.clientX; lastY=e.clientY;
  if(moveQueued) return; moveQueued=true;
  requestAnimationFrame(()=>{
    moveQueued=false; if(!dragging) return;
    const dx=lastX-(prevX??lastX), dy=lastY-(prevY??lastY);
    const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));
    for(let i=1;i<=steps;i++){
      const x=(prevX??lastX)+dx*i/steps, y=(prevY??lastY)+dy*i/steps;
      let el=document.elementFromPoint(x,y);
      if(el&&!el.classList.contains('cell')) el=el.closest('.cell');
      if(el) paintCell(el);
    }
    prevX=lastX; prevY=lastY;
  });
});
function endDrag(){ painting=null; dragging=false; }
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
grid.addEventListener('contextmenu',e=>e.preventDefault());
const modeO=document.getElementById('modeO'), modeTri=document.getElementById('modeTri'), modeX=document.getElementById('modeX');
function setMode(v){ mode=v; modeO.classList.toggle('on',v===1); modeTri.classList.toggle('on',v===0.5); modeTri.classList.toggle('tri',v===0.5); modeX.classList.toggle('on',v===-1); modeX.classList.toggle('xb',v===-1); }
modeO.addEventListener('click',()=>setMode(1));
modeTri.addEventListener('click',()=>setMode(0.5));
modeX.addEventListener('click',()=>setMode(-1));
const scrollBtn=document.getElementById('scrollBtn'), paintBtn=document.getElementById('paintBtn');
function setScrollMode(v){ scrollMode=v; document.body.classList.toggle('scrollmode',v); scrollBtn.classList.toggle('on',v); paintBtn.classList.toggle('on',!v); }
scrollBtn.addEventListener('click',()=>setScrollMode(true));
paintBtn.addEventListener('click',()=>setScrollMode(false));
const wrap=document.getElementById('wrap');
let sdrag=null;
wrap.addEventListener('pointerdown',e=>{
  if(!scrollMode||e.pointerType==='touch') return;
  sdrag={x:e.clientX, sl:wrap.scrollLeft};
  document.body.classList.add('grabbing');
});
document.addEventListener('pointermove',e=>{ if(sdrag) wrap.scrollLeft=sdrag.sl-(e.clientX-sdrag.x); });
document.addEventListener('pointerup',()=>{ sdrag=null; document.body.classList.remove('grabbing'); });
function setView(v){
  view=v;
  const isDate=(evKind==='date');
  document.getElementById('editView').style.display=(v==='edit')?'':'none';
  document.getElementById('editFoot').style.display=(v==='edit')?'flex':'none';
  document.getElementById('listView').style.display=(v==='list')?'':'none';
  document.getElementById('listFoot').style.display=(v==='list')?'flex':'none';
  document.getElementById('plist').style.display=(v==='list')?'':'none';
  document.getElementById('dateView').style.display=(v==='edit'&&isDate)?'':'none';
  document.getElementById('paintView').style.display=(v==='edit'&&!isDate)?'':'none';
  document.getElementById('scrollBtn').closest('.group').style.display=isDate?'none':'';
  if(v==='list') renderList(); else { render();
    if(isDate){ buildDateCals(); }
    else requestAnimationFrame(()=>requestAnimationFrame(scrollToEarliest));
  }
}
function startEdit(name){
  editingName=name||null;
  document.getElementById('deleteMineBtn').style.display=(name && others.has(name))?'':'none';
  if(name){ nameEl.value=name; localStorage.setItem('nurie-name',name); adopt(name); }
  setView('edit');
}
document.getElementById('answerBtn').addEventListener('click',()=>{
  // 「回答する」は常に新しい回答として開始（自分の続き編集は一覧で自分の名前を押す）
  editingName=null;
  document.getElementById('deleteMineBtn').style.display='none';
  nameEl.value=''; noteEl.value='';
  mine=new Map();
  render();
  setView('edit');
});
document.getElementById('backBtn').addEventListener('click',()=>setView('list'));
let dPainting=null, dDrag=false;
function renderDateCell(td){
  const v=mine.get(td.dataset.ds);
  td.classList.toggle('o',v===1); td.classList.toggle('t',v===0.5);
  const mk=td.querySelector('.dmark');
  if(mk) mk.innerHTML=(v===1)?SVG_O:(v===0.5)?SVG_T:SVG_X;
}
function renderDateCals(){ document.querySelectorAll('#dateView td.dcell').forEach(renderDateCell); }
function applyDateCell(td){
  const ds=td.dataset.ds;
  if(dPainting===null) dPainting=(mine.get(ds)===mode)?'del':'set';
  const before=mine.get(ds);
  if(dPainting==='set') mine.set(ds,mode); else mine.delete(ds);
  if(mine.get(ds)!==before){ renderDateCell(td); markDirty(); }
}
function buildDateCals(){
  const dv=document.getElementById('dateView'); dv.innerHTML='';
  const months={}; days.forEach(ds=>{ const k=ds.slice(0,7); (months[k]=months[k]||[]).push(ds); });
  Object.keys(months).sort().forEach(mk=>{
    const parts=mk.split('-'); const y=+parts[0], mo=+parts[1];
    const title=document.createElement('div'); title.className='calMonthTitle'; title.textContent=y+'年 '+mo+'月'; dv.appendChild(title);
    const t=document.createElement('table'); t.className='dcal';
    const hr=document.createElement('tr');
    '日月火水木金土'.split('').forEach((w,i)=>{ const th=document.createElement('th'); th.textContent=w; if(i===0) th.style.color='#dc2626'; if(i===6) th.style.color='#2563eb'; hr.appendChild(th); });
    t.appendChild(hr);
    const first=new Date(y,mo-1,1), startDay=first.getDay(), dim=new Date(y,mo,0).getDate();
    const cand=new Set(months[mk]);
    let dnum=1;
    for(let r=0;r<6&&dnum<=dim;r++){
      const tr=document.createElement('tr');
      for(let c=0;c<7;c++){
        const td=document.createElement('td');
        if((r===0&&c<startDay)||dnum>dim){ td.className='dim'; tr.appendChild(td); continue; }
        const ds=y+'-'+String(mo).padStart(2,'0')+'-'+String(dnum).padStart(2,'0');
        if(!cand.has(ds)){ td.className='na'; td.innerHTML='<span class="dnum" style="font-weight:400">'+dnum+'</span>'; }
        else{
          td.className='dcell'; td.dataset.ds=ds;
          td.innerHTML='<span class="dnum">'+dnum+'</span><span class="dmark"></span>';
          td.addEventListener('pointerdown',e=>{ e.preventDefault(); dDrag=true; dPainting=null; applyDateCell(td); });
          td.addEventListener('pointerenter',()=>{ if(dDrag) applyDateCell(td); });
        }
        dnum++; tr.appendChild(td);
      }
      t.appendChild(tr);
    }
    dv.appendChild(t);
  });
  renderDateCals();
}
document.addEventListener('pointerup',()=>{ dDrag=false; dPainting=null; });
function renderDateListTables(lv, names){
  const outer=document.createElement('div'); outer.className='listWrap';
  const t=document.createElement('table'); t.className='listTable';
  const hr=document.createElement('tr');
  const th0=document.createElement('th'); th0.className='nameH'; hr.appendChild(th0);
  days.forEach(ds=>{
    const th=document.createElement('th'); th.className='dateH';
    const d=new Date(ds+'T00:00:00');
    th.innerHTML='<div>'+(d.getMonth()+1)+'/'+d.getDate()+'</div><div style="font-size:10px;color:#94a3b8">'+'日月火水木金土'[d.getDay()]+'</div>';
    hr.appendChild(th);
  });
  t.appendChild(hr);
  const counts=days.map(ds=>{ let c=0; names.forEach(n=>{ if((others.get(n)||{})[ds]===1) c++; }); return c; });
  const maxC=Math.max(1,...counts);
  names.forEach(n=>{
    const tr=document.createElement('tr');
    const td0=document.createElement('td'); td0.className='name'; td0.title='押すとこの回答を編集できます';
    td0.addEventListener('click',()=>startEdit(n));
    const inw=document.createElement('div'); inw.className='nameCellIn';
    const nsp=document.createElement('span'); nsp.className='nameTxt'; nsp.textContent=n; inw.appendChild(nsp);
    if(isAdmin){
      const dbtn=document.createElement('button'); dbtn.className='danger pdel'; dbtn.textContent='×'; dbtn.title=n+' の回答を削除';
      dbtn.addEventListener('click',async(e)=>{ e.stopPropagation(); await adminDeleteParticipant(n); });
      inw.appendChild(dbtn);
    }
    td0.appendChild(inw); tr.appendChild(td0);
    const marks=others.get(n)||{};
    days.forEach(ds=>{
      const v=marks[ds];
      const td=document.createElement('td');
      td.className='sym '+((v===1)?'o':(v===0.5)?'t':'x');
      td.style.width='40px'; td.style.minWidth='40px';
      td.innerHTML=(v===1)?SVG_O:(v===0.5)?SVG_T:SVG_X;
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  const trS=document.createElement('tr');
  const tdS0=document.createElement('td'); tdS0.className='sumName'; tdS0.innerHTML=SVG_O.replace('cell-ic','sum-ic')+'の数'; trS.appendChild(tdS0);
  days.forEach((ds,idx)=>{
    const td=document.createElement('td'); td.className='sum'; td.style.width='40px'; td.style.minWidth='40px';
    const c=counts[idx];
    if(c>0){ const r=c/maxC; td.style.background='rgba(200,16,46,'+(0.12+0.78*r).toFixed(2)+')'; if(r>=0.55) td.style.color='#fff'; td.textContent=c; }
    trS.appendChild(td);
  });
  t.appendChild(trS);
  outer.appendChild(t);
  const outerBox=document.createElement('div'); outerBox.className='listOuter';
  const fL=document.createElement('div'); fL.className='listFade l';
  const fR=document.createElement('div'); fR.className='listFade r';
  outerBox.appendChild(outer); outerBox.appendChild(fL); outerBox.appendChild(fR);
  lv.appendChild(outerBox);
  const updF=()=>{ const max=outer.scrollWidth-outer.clientWidth;
    fR.style.opacity=(max>2 && outer.scrollLeft<max-2)?'1':'0';
    fL.style.opacity=(outer.scrollLeft>2)?'1':'0'; };
  outer.addEventListener('scroll',updF,{passive:true});
  requestAnimationFrame(updF);
}
function renderList(){
  const lv=document.getElementById('listView');
  const names=[...others.keys()];
  lv.innerHTML='';
  if(!names.length){ lv.innerHTML='<p style="text-align:center;color:#64748b;font-size:13px;margin:22px 0">まだ回答がありません。</p>'; return; }
  const noted=names.filter(n=>(notes.get(n)||'').trim());
  if(noted.length){
    const box=document.createElement('div'); box.style.cssText='margin:10px 0 2px;font-size:12.5px;line-height:1.9';
    const hd=document.createElement('div'); hd.style.cssText='font-weight:700;color:#64748b;font-size:12px'; hd.textContent='💬 一言'; box.appendChild(hd);
    noted.forEach(n=>{
      const line=document.createElement('div');
      const b=document.createElement('b'); b.textContent=n; line.appendChild(b);
      line.appendChild(document.createTextNode('：'+notes.get(n)));
      box.appendChild(line);
    });
    lv.appendChild(box);
  }
  if(evKind==='date'){ renderDateListTables(lv, names); return; }
  days.forEach(ds=>{
    const daySlots=slots.filter(m=>{ const key=ds+'|'+(m/SLOT); return !effAllowed || effAllowed.has(key); });
    if(!daySlots.length) return;
    const h=document.createElement('h3'); h.style.cssText='margin:16px 0 6px;font-size:14.5px';
    h.textContent=dayLabel(ds); lv.appendChild(h);
    const outer=document.createElement('div'); outer.className='listWrap';
    const t=document.createElement('table'); t.className='listTable';
    const hr=document.createElement('tr');
    const th0=document.createElement('th'); th0.className='nameH'; hr.appendChild(th0);
    daySlots.forEach((m,idx)=>{ const th=document.createElement('th'); th.className='time'+(m%60===0?' hourL':'');
      if(m%60===0){ const sp=document.createElement('span'); sp.className='tick'; sp.textContent=fmt(m); th.appendChild(sp); }
      if(idx===daySlots.length-1 && (m+SLOT)%60===0){
        const sp2=document.createElement('span'); sp2.className='tick';
        sp2.style.left='100%'; sp2.textContent=fmt(m+SLOT); th.appendChild(sp2);
      }
      hr.appendChild(th); });
    t.appendChild(hr);
    // ○の合計行のための全体最大値（この日の表の中で計算）
    const counts=daySlots.map(m=>{
      let c=0; const key=ds+'|'+(m/SLOT);
      names.forEach(n=>{ if((others.get(n)||{})[key]===1) c++; });
      return c;
    });
    names.forEach(n=>{
      const tr=document.createElement('tr');
      const td0=document.createElement('td'); td0.className='name';
      td0.title='押すとこの回答を編集できます';
      td0.addEventListener('click',()=>startEdit(n));
      const inw=document.createElement('div'); inw.className='nameCellIn';
      const nsp=document.createElement('span'); nsp.className='nameTxt'; nsp.textContent=n;
      inw.appendChild(nsp);
      if(isAdmin){
        const dbtn=document.createElement('button'); dbtn.className='danger pdel'; dbtn.textContent='×';
        dbtn.title=n+' の回答を削除';
        dbtn.addEventListener('click',async(e)=>{ e.stopPropagation(); await adminDeleteParticipant(n); });
        inw.appendChild(dbtn);
      }
      td0.appendChild(inw);
      tr.appendChild(td0);
      const marks=others.get(n)||{};
      daySlots.forEach(m=>{
        const v=marks[ds+'|'+(m/SLOT)];
        const td=document.createElement('td');
        td.className='sym '+((v===1)?'o':(v===0.5)?'t':'x')+(m%60===0?' hourL':'');
        td.innerHTML=(v===1)?SVG_O:(v===0.5)?SVG_T:SVG_X;
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    // 一番下に ○ の合計行
    const maxC=Math.max(1,...counts);
    const trS=document.createElement('tr');
    const tdS0=document.createElement('td'); tdS0.className='sumName'; tdS0.innerHTML=SVG_O.replace('cell-ic','sum-ic')+'の数'; trS.appendChild(tdS0);
    daySlots.forEach((m,idx)=>{
      const td=document.createElement('td'); td.className='sum'+(m%60===0?' hourL':'');
      const c=counts[idx];
      if(c>0){
        const r=c/maxC;
        td.style.background='rgba(200,16,46,'+(0.12+0.78*r).toFixed(2)+')';
        if(r>=0.55) td.style.color='#fff';
        td.textContent=c;
      } else td.textContent='';
      trS.appendChild(td);
    });
    t.appendChild(trS);
    outer.appendChild(t);
    const outerBox=document.createElement('div'); outerBox.className='listOuter';
    const fL=document.createElement('div'); fL.className='listFade l';
    const fR=document.createElement('div'); fR.className='listFade r';
    outerBox.appendChild(outer); outerBox.appendChild(fL); outerBox.appendChild(fR);
    lv.appendChild(outerBox);
    const updF=()=>{ const max=outer.scrollWidth-outer.clientWidth;
      fR.style.opacity=(max>2 && outer.scrollLeft<max-2)?'1':'0';
      fL.style.opacity=(outer.scrollLeft>2)?'1':'0'; };
    outer.addEventListener('scroll',updF,{passive:true});
    requestAnimationFrame(updF);
  });
}
document.getElementById('clearBtn').addEventListener('click',()=>{ mine.clear(); render(); markDirty(); });
const fadeL=document.getElementById('fadeL'), fadeR=document.getElementById('fadeR'), scrollHint=document.getElementById('scrollHint');
function updateFades(){
  const max=wrap.scrollWidth-wrap.clientWidth;
  fadeL.style.opacity=wrap.scrollLeft>4?1:0;
  fadeR.style.opacity=(max-wrap.scrollLeft)>4?1:0;
}
wrap.addEventListener('scroll',updateFades,{passive:true});
window.addEventListener('resize',updateFades);
document.getElementById('copyAdminBtn').addEventListener('click',async()=>{
  const msg=document.getElementById('adminMsg');
  const adminUrl=location.origin+location.pathname+'?admin='+adminKey;
  try{ await navigator.clipboard.writeText(adminUrl); msg.textContent='管理ページのURLをコピーしました'; }

document.getElementById('shareBtn').addEventListener('click',async()=>{
  const url=location.origin+'/e/'+eventId;
  const msg=document.getElementById('shareMsg');
  try{ await navigator.clipboard.writeText(url); msg.textContent='参加者用URLをコピーしました'; }

document.getElementById('deleteMineBtn').addEventListener('click',async()=>{
  const target=editingName;
  if(!target) return;
  if(!confirm('あなたの回答「'+target+'」を削除しますか？')) return;
  const r=await fetch('/api/events/'+eventId+'/participant/self-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:target})});
  if(r.ok){
    others.delete(target); notes.delete(target);
    if(localStorage.getItem('nurie-name')===target) localStorage.removeItem('nurie-name');
    if(localStorage.getItem('tonton-name')===target) localStorage.removeItem('tonton-name');
    editingName=null; mine=new Map(); nameEl.value='';
    document.getElementById('deleteMineBtn').style.display='none';
    renderPlist(); setView('list'); alert('回答を削除しました');
  } else alert('削除に失敗しました');
});
async function adminDeleteParticipant(n){
  if(!isAdmin) return;
  if(!confirm('参加者「'+n+'」の回答を削除しますか？')) return;
  const r=await fetch('/api/events/'+eventId+'/participant/admin-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,adminKey})});
  if(r.ok){ others.delete(n); notes.delete(n); renderPlist(); renderList(); }
  else alert('参加者の削除に失敗しました');
}
document.getElementById('csvBtn').addEventListener('click',async()=>{
  const r=await fetch('/api/events/'+eventId+'/export.csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey})});
  if(!r.ok){ alert('ダウンロードに失敗しました'); return; }
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='nurie-'+eventId+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
});
const delBtn=document.getElementById('delBtn');
if(delBtn) delBtn.addEventListener('click',async()=>{
  if(!confirm('この調整表を削除しますか？')) return;
  const r=await fetch('/api/events/'+eventId+'/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminKey})});

// 隠し機能：タイトルを5回タップでドット絵出力ボタンを表示
let titleTaps=0, tapTimer=null;
document.getElementById('title').addEventListener('click',()=>{
  titleTaps++;
  clearTimeout(tapTimer); tapTimer=setTimeout(()=>titleTaps=0,1200);
  if(titleTaps>=5){ if(evKind!=='date') document.getElementById('dotBtn').style.display=''; titleTaps=0; }
});
document.getElementById('dotBtn').addEventListener('click',()=>{
  const cell=16;
  const cv=document.createElement('canvas');
  cv.width=slots.length*cell; cv.height=days.length*cell;
  const ctx=cv.getContext('2d');
  days.forEach((ds,r)=>{
    slots.forEach((m,c)=>{
      const v=mine.get(ds+'|'+(m/SLOT));
      ctx.fillStyle=(v===1)?'#c8102e':(v===0.5)?'#f3a7b1':'#f4f4f5';
      ctx.fillRect(c*cell,r*cell,cell,cell);
    });
  });
  const a=document.createElement('a');
  a.download='nurie-dot.png'; a.href=cv.toDataURL('image/png'); a.click();
});
// ダークモード切替
const themeBtn=document.getElementById('themeBtn');
function applyTheme(){
  const t=(localStorage.getItem('nurie-theme')||localStorage.getItem('tonton-theme'));
  if(t){ document.body.dataset.theme=t; } else { delete document.body.dataset.theme; }
  const dark=t? (t==='dark') : matchMedia('(prefers-color-scheme: dark)').matches;
  themeBtn.textContent=dark?'☀️':'🌙';
}
themeBtn.addEventListener('click',()=>{
  const darkNow=document.body.dataset.theme? (document.body.dataset.theme==='dark') : matchMedia('(prefers-color-scheme: dark)').matches;
  localStorage.setItem('nurie-theme', darkNow?'light':'dark');
  applyTheme();
});
applyTheme();
